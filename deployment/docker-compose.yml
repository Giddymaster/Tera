# Self-hosted production stack: PostgreSQL (private), FastAPI backend (private),
# and Caddy serving the SPA + reverse-proxying the API with automatic HTTPS.
#
#   cd deployment
#   cp .env.production.example .env.production   # fill in secrets
#   docker compose --env-file .env.production up -d --build
#
# PostgreSQL has NO published port: it is reachable only on the internal network.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      # Built from the Postgres vars so there is one source of truth.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
    # No published ports: reached only via Caddy.

  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  # Self-hosted RustDesk server for real remote control (Milestone: RustDesk).
  # hbbs = ID/rendezvous server, hbbr = relay. Clients connect through these,
  # not RustDesk's public servers. Open ports 21115-21119 TCP and 21116/udp on
  # the host firewall. After first start, read the public key and set
  # RUSTDESK_KEY (see docs/deployment.md), then redeploy.
  hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    restart: unless-stopped
    ports:
      - "21117:21117"
      - "21119:21119"
    volumes:
      - rustdesk_data:/root

  hbbs:
    image: rustdesk/rustdesk-server:latest
    command: hbbs -r ${RUSTDESK_HOST}:21117
    restart: unless-stopped
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - rustdesk_data:/root
    depends_on:
      - hbbr

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
  rustdesk_data:
